<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jetty Showtime — Appointment Booking</title>
<meta name="description" content="Book an appointment slot at a Jetty trade show or sales meeting.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230F0F0F'/%3E%3Cpath d='M6 21c3.6 0 3.6-3 7.2-3s3.6 3 7.2 3 3.6-3 5.6-3' stroke='%234A8A84' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Crect x='9' y='7' width='14' height='8' rx='1.5' fill='none' stroke='%23C4A067' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="hdr"></div>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow">Appointment Booking</div>
    <h1>Pick a show.<br>Pick a time.</h1>
    <div class="meta">Live availability. No back-and-forth. Reps and retailers book the same grid.</div>
    <div class="hero-actions">
      <a class="btn btn-tan" href="new.html" data-role-admin hidden>+ Create New Event</a>
    </div>
  </div>
</section>

<main class="wrap section">
  <div id="alert" class="alert" hidden></div>
  <div class="section-title">Upcoming &amp; Active Events</div>
  <div id="list"><div class="loading"><div class="spinner"></div>Loading events…</div></div>

  <div id="archived-wrap" class="hidden" style="margin-top:38px">
    <div class="section-title">Past Events</div>
    <div id="archived" class="event-list"></div>
  </div>
</main>

<div id="ftr"></div>

<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  document.getElementById('hdr').innerHTML = ST.header('events');
  document.getElementById('ftr').innerHTML = ST.footer();

  var list = document.getElementById('list');
  var alertBox = document.getElementById('alert');

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + ST.pad(d.getMonth() + 1) + '-' + ST.pad(d.getDate());
  }

  function card(ev) {
    var slotsPerDay = 0;
    (ev.days || []).forEach(function (d) { slotsPerDay += ST.slotsFor(d, ev).length; });
    var total = slotsPerDay * (ev.stations || []).length;
    var past = ev.endDate && ev.endDate < todayStr();

    var a = ST.el('a', { class: 'event-card', href: 'event.html?e=' + encodeURIComponent(ev.eventId) });
    a.innerHTML =
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'
      + '<h3>' + ST.esc(ev.name) + '</h3>'
      + '<span class="pill' + (past ? ' grey' : '') + '">' + (past ? 'Past' : 'Open') + '</span>'
      + '</div>'
      + '<div class="when">' + ST.esc(ST.dateRange(ev.startDate, ev.endDate))
      + (ev.venue || ev.city ? ' &middot; ' + ST.esc([ev.venue, ev.city].filter(Boolean).join(', ')) : '')
      + '</div>'
      + '<div class="stats">'
      + '<div><b>' + (ev.days || []).length + '</b>Days</div>'
      + '<div><b>' + (ev.stations || []).length + '</b>Stations</div>'
      + '<div><b>' + total + '</b>Slots</div>'
      + '<div><b>' + ev.slotMinutes + '</b>Min each</div>'
      + '</div>';
    return a;
  }

  function render(events) {
    var today = todayStr();
    var upcoming = events.filter(function (e) { return !e.endDate || e.endDate >= today; });
    var past = events.filter(function (e) { return e.endDate && e.endDate < today; });

    list.innerHTML = '';
    if (!upcoming.length) {
      list.appendChild(ST.el('div', {
        class: 'card',
        html: '<p style="margin:0 0 14px"><strong>No upcoming events yet.</strong></p>'
          + '<p class="muted small" style="margin:0 0 18px">Create one and share the link — anyone with it can book a slot.</p>'
          + (ST.isAdmin() ? '<a class="btn" href="new.html">+ Create New Event</a>' : '')
      }));
    } else {
      var grid = ST.el('div', { class: 'event-list' });
      upcoming.forEach(function (e) { grid.appendChild(card(e)); });
      list.appendChild(grid);
    }

    if (past.length) {
      document.getElementById('archived-wrap').classList.remove('hidden');
      var pg = document.getElementById('archived');
      pg.innerHTML = '';
      past.reverse().forEach(function (e) { pg.appendChild(card(e)); });
    }
  }

  ST.applyRoleToChrome();
  ST.get({ action: 'events' })
    .then(function (d) { render(d.events || []); })
    .catch(function (err) {
      list.innerHTML = '';
      ST.showAlert(alertBox, 'error', err.message);
      if (!ST.apiConfigured()) {
        list.appendChild(ST.el('div', {
          class: 'card',
          html: '<h3 style="font-size:16px;margin-bottom:10px">Finish the setup</h3>'
            + '<ol class="small muted" style="margin:0;padding-left:18px;line-height:1.9">'
            + '<li>Open your Google Sheet &rarr; <strong>Extensions &rarr; Apps Script</strong>.</li>'
            + '<li>Paste in <span class="mono">apps-script/Code.gs</span> from this repo and save.</li>'
            + '<li>Run the <span class="mono">setup</span> function once and approve permissions.</li>'
            + '<li><strong>Deploy &rarr; New deployment &rarr; Web app</strong>, execute as <em>Me</em>, access <em>Anyone</em>.</li>'
            + '<li>Copy the <span class="mono">/exec</span> URL into <span class="mono">config.js</span> in this repo.</li>'
            + '</ol>'
        }));
      }
    });
})();
</script>
</body>
</html>
